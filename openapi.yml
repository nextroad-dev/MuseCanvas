{
  "openapi": "3.1.0",
  "info": {
    "title": "MuseCanvas Canvas M1/M2 API subset",
    "version": "1.0.0",
    "description": "Only six canvas/agent/settings paths and ten operations, not complete service. Pretty JSON serialization in openapi.yml: JSON is valid YAML 1.2, accepted by standard OpenAPI tools; native JSON.parse tests need no YAML dependency. Cookie session authentication, not token/Bearer. Dispatcher mutation Origin CSRF: absent/empty Origin allowed, otherwise parsed URL host including port, case-insensitive, must equal Host or rightmost nonempty X-Forwarded-Host. Scheme not compared; trusted proxy must safely overwrite/append forwarded host. Invalid Origin rejected before authentication with 403 CSRF_REJECTED; no CSRF token. Active live actor session required, admin role additionally for settings; actor canvas ownership is enforced. Typed bodies reject unknown fields. UTF-16/byte/graph limits in descriptions/x-* are runtime parser rules, not all expressible in JSON Schema. Redis shared fixed-window limiters fail OPEN on Redis failure: no exact request budget guarantee during outage. Durable turn/job budgets and separate claim/generation transactions do not promise cross-service atomicity; bounded TOCTOU remains. Examples synthetic, HTTP success requires seeded owned refs, no secrets or real user prompts."
  },
  "tags": [
    {
      "name": "Canvas"
    },
    {
      "name": "Canvas agent settings"
    }
  ],
  "security": [
    {
      "museSession": []
    }
  ],
