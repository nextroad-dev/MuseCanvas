{
  "openapi": "3.1.0",
  "info": {
    "title": "MuseCanvas REST API",
    "version": "1.0.0",
    "description": "Complete REST API inventory for MuseCanvas, covering health, setup onboarding, authentication & account OAuth, media models, jobs, library, generation uploads, signed media transport, administration, Agent Core V1, and Agent image edit preparation. Pretty JSON serialization in openapi.yml is intentional: it keeps diffs reviewable."
  },
  "tags": [
    {
      "name": "Health",
      "description": "Service readiness and dependency checks"
    },
    {
      "name": "Public",
      "description": "Unauthenticated registration mode and signed media endpoints"
    },
    {
      "name": "Setup",
      "description": "First-run installation wizard and bootstrap configuration"
    },
    {
      "name": "Auth",
      "description": "Email OTP and OAuth authentication lifecycle"
    },
    {
      "name": "Account",
      "description": "Authenticated user session and linked OAuth identities"
    },
    {
      "name": "Workspace",
      "description": "Media model catalog, generation jobs, library assets, and uploads"
    },
    {
      "name": "Admin",
      "description": "Administrative dashboard, users, invitations, jobs, models, credentials, plugins, OAuth, and prompt templates"
    },
    {
      "name": "Media model defaults"
    },
    {
      "name": "agent-core",
      "description": "Owner-scoped durable control-plane intent and finite event replay"
    },
    {
      "name": "Agent image edit"
    }
  ],
  "security": [
    {
      "museSession": []
    }
  ],
