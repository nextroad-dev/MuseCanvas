name: musecanvas

# Image-based deployment stack.
# This file intentionally does NOT start MinIO or Mailpit and does NOT seed
# any SMTP/S3 defaults (no BUNDLED_SERVICES): SMTP, object storage, public
# origin, OAuth, limits, and prompt templates are database settings managed
# via the onboarding wizard at /setup. Only bootstrap secrets, default-deny
# policy flags, and optional one-release legacy crypto keys are passed via env.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: musecanvas
      POSTGRES_USER: musecanvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U musecanvas -d musecanvas"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    image: ghcr.io/nextroad-dev/musecanvas-api:${MUSECANVAS_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment: &backend-env
      NODE_ENV: production
      DATABASE_URL: postgresql://musecanvas:${POSTGRES_PASSWORD}@postgres:5432/musecanvas
      REDIS_URL: redis://redis:6379
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY is required}
      ALLOW_INSECURE_SMTP: ${ALLOW_INSECURE_SMTP:-false}
      ALLOW_INSECURE_PROVIDER_BASE_URL: ${ALLOW_INSECURE_PROVIDER_BASE_URL:-false}
      ALLOW_PRIVATE_PROVIDER_BASE_URL: ${ALLOW_PRIVATE_PROVIDER_BASE_URL:-false}

    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:3001/api/health/ready]
      interval: 5s
      timeout: 3s
      retries: 30
  db-migrate:
    image: ghcr.io/nextroad-dev/musecanvas-api:${MUSECANVAS_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["sh", "-c", "pnpm --filter @musecanvas/database exec tsx src/migrate.ts && pnpm --filter @musecanvas/database exec tsx src/seed.ts && pnpm --filter @musecanvas/database exec tsx ../../scripts/seed-bundled-services.ts"]
    environment:
      DATABASE_URL: postgresql://musecanvas:${POSTGRES_PASSWORD}@postgres:5432/musecanvas
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY is required}

  worker:
    image: ghcr.io/nextroad-dev/musecanvas-worker:${MUSECANVAS_IMAGE_TAG:-latest}
    depends_on:
      api:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment: *backend-env

  web:
    image: ghcr.io/nextroad-dev/musecanvas-web:${MUSECANVAS_IMAGE_TAG:-latest}

  nginx:
    image: ghcr.io/nextroad-dev/musecanvas-nginx:${MUSECANVAS_IMAGE_TAG:-latest}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "${MUSECANVAS_HTTP_PORT:-18080}:80"

volumes:
  postgres_data: {}
  redis_data: {}
