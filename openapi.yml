      "patch": {
        "operationId": "updateMediaModelDefaults",
        "summary": "Elect default media models",
        "description": "Admin only. Elects an enabled, non-deleted model of the matching kind as that kind default inside one transaction, clearing the previous default. A kind is replaced, never cleared; an absent key leaves that kind untouched. Language models cannot be elected.",
        "tags": [
          "Media model defaults"
        ],
        "x-access": "admin",
        "security": [
          {
            "museSession": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/UpdateMediaModelDefaultsRequest"
              },
              "examples": {
                "example1": {
                  "value": {
                    "imageModelId": "123e4567-e89b-12d3-a456-426614174000",
                    "videoModelId": "223e4567-e89b-12d3-a456-426614174001"
