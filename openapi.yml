          }
        ],
        "responses": {
          "200": {
            "description": "Finite replay and bounded polling SSE; abort closes only this transport.",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string",
                  "description": "Each data line is a DisplayEvent or TransportFrame JSON object; durable event names match data.type, id=sessionId:cursor."
