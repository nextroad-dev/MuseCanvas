    "/api/images/edit/preparations": {
      "post": {
        "tags": [
          "Agent image edit"
        ],
        "operationId": "prepareAgentImageEdit",
        "x-access": "actor",
        "summary": "Stage a source and trusted inpaint mask",
        "description": "Requires an active authenticated actor, AGENT_CORE_ENABLED and migration 0045. Requests without turnId (including session-only requests) require actor-specific new-work admission. A turnId requires sessionId and must match an owned, unarchived session's active nonterminal turn with no cancellation and a future database-clock deadline; that accepted-work proof permits preparation while new admission is paused. Invalid or foreign context returns the same 404 before staging. Old clients without context follow new-work admission. Namespace disabled returns 404 before authentication. Stages inputs only; does not create a generation job or bypass final message, attachment provenance or approval checks. Context authorizes staging and does not persistently bind preparation identity to a turn.",
        "requestBody": {
          "required": true,
          "content": {
            "multipart/form-data": {
              "schema": {
                "type": "object",
                "additionalProperties": false,
                "required": [
                  "modelId"
                ],
                "properties": {
                  "modelId": {
                    "type": "string",
                    "format": "uuid",
                    "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
                  },
                  "assetId": {
                    "type": "string",
                    "format": "uuid",
                    "pattern": "^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[1-5][0-9a-fA-F]{3}-[89aAbB][0-9a-fA-F]{3}-[0-9a-fA-F]{12}$"
                  },
                  "image": {
                    "type": "string",
                    "format": "binary",
                    "description": "Source PNG or JPEG."
                  },
                  "region": {
                    "type": "string",
                    "description": "JSON text containing x, y, width, height in source pixels.",
                    "example": "{\"x\":100,\"y\":100,\"width\":400,\"height\":300}"
                  },
                  "mask": {
                    "type": "string",
                    "format": "binary",
                    "description": "PNG mask with an alpha channel."
                  },
                  "idempotencyKey": {
                    "type": "string",
                    "maxLength": 128
                  },
                  "sessionId": {
                    "$ref": "#/components/schemas/Uuid"
                  },
                  "turnId": {
                    "$ref": "#/components/schemas/Uuid"
                  }
                },
                "dependentRequired": {
                  "turnId": [
                    "sessionId"
                  ]
                },
                "allOf": [
                  {
                    "oneOf": [
                      {
                        "required": [
                          "assetId"
                        ]
                      },
                      {
                        "required": [
                          "image"
                        ]
                      }
                    ]
                  },
                  {
                    "oneOf": [
                      {
                        "required": [
                          "region"
                        ]
                      },
                      {
                        "required": [
                          "mask"
                        ]
                      }
                    ]
                  }
                ]
              }
            }
          }
        },
        "responses": {
          "202": {
            "description": "Inputs prepared; no job created",
            "content": {
              "application/json": {
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": [
                    "success",
                    "data"
                  ],
                  "properties": {
                    "success": {
                      "const": true
                    },
                    "data": {
                      "$ref": "#/components/schemas/AgentEditPreparation"
                    }
                  }
                }
              }
            }
          },
          "400": {
            "description": "Invalid fields, image, selection or mask",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "401": {
            "description": "Authentication required",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "403": {
            "description": "Mutation Origin rejected",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "404": {
            "description": "Feature disabled, model or asset unavailable, or owner/session/active-turn context unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "409": {
            "description": "Model does not support masks, or staged input/preparation conflict",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "429": {
            "description": "Preparation rate limit exceeded",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          },
          "503": {
            "description": "New-work actor admission closed, preparation schema missing, or storage unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/ErrorEnvelope"
                }
              }
            }
          }
        }
      }
    },
