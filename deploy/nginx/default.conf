server {
  listen 80;
  client_max_body_size 2m;
  # Baseline security headers. `always` keeps them on error responses (4xx/5xx)
  # too, and no location below declares add_header, so they are inherited.
  add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $api_upstream http://api:3001;
  set $web_upstream http://web:3000;
  # Admin plugin code packages are ~5 MB artifacts and must not be rejected
  # with 413 by the 2m server cap. `POST /api/images/edit` is the same problem in
  # a bigger shape: its multipart body carries a full PNG/JPEG source image plus
  # an alpha mask (up to 10 MB + 4 MB by the API's own limits), which a browser
  # posts in one go. Both blocks repeat the whole /api/ proxy config on purpose:
  # $api_upstream is a variable resolved via `resolver`, so a location that only
  # overrides client_max_body_size would mis-proxy.
  location /api/admin/plugins/upload {
    client_max_body_size 8m;
    proxy_pass $api_upstream$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location /api/images/edit {
    client_max_body_size 24m;
    proxy_pass $api_upstream$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Local-disk storage: browsers POST reference images to a signed API URL instead of S3.
  # Same cap as /api/images/edit; the API enforces the exact per-upload limit while streaming.
  location /api/media/upload {
    client_max_body_size 24m;
    proxy_request_buffering off;
    proxy_pass $api_upstream$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  # Interactive Agent messages use SSE; keep ordinary JSON routes buffered.
  location ~* ^/api/canvases/[0-9a-f-]+/agent/messages$ {
    proxy_pass $api_upstream$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 310s;
  }
  location /api/ {
    proxy_pass $api_upstream$request_uri;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
  location / { proxy_pass $web_upstream$request_uri; proxy_set_header Host $http_host; }
}
