        "description": "Feature-disabled namespace returns 404 before authentication, DB or rate Redis. Enabled requires an active authenticated owner using the muse_session cookie; missing and cross-owner resources return the same 404. Private annotations never append Agent items or events, enter model context, or start Runner/tool/provider execution. No admission-ready gate is required. Any Idempotency-Key or Last-Event-ID header is rejected (400). No query parameters are accepted. Same-origin validation required. JSON body max 40000 bytes and 5 second read deadline. Shared per-owner write rate limit: 30 requests per 60 seconds. Body clientRequestId UUID is the sole authority for idempotency and is scoped to the owner across create/reply operations; reuse with a different operation, scope or payload returns 409. Identical replay returns the current thread without appending another message. Appends a private reply with at most 8000 UTF-8 bytes. At most 100 messages including the initial message (99 replies); another new reply returns 409, but an identical replay at the cap still succeeds.",
        "x-access": "public"
      }
    },
