                "schema": {
                  "$ref": "#/components/schemas/AgentCoreFailure"
                }
              }
            }
          },
          "404": {
            "$ref": "#/components/responses/AgentCoreNotFound"
          },
          "409": {
            "$ref": "#/components/responses/AgentCoreConflict"
          },
          "429": {
            "description": "Bounded request rate exceeded",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AgentCoreFailure"
                }
              }
            }
          },
          "503": {
            "$ref": "#/components/responses/AgentCoreUnavailable"
          }
        },
        "description": "Feature-disabled namespace returns 404 before authentication, DB or rate Redis. Enabled requires an active authenticated owner; missing and cross-owner resources return the same 404. No Runner/tool/provider execution. Cursor is canonical decimal <= int64 maximum. Last-Event-ID is sessionId:cursor and must equal query cursor if both supplied (409 otherwise); cross-session/invalid IDs are 400. Ahead cursor is 409 before streaming. Frames have id/event/data. ready does not advance cursor. Heartbeat every ~5s; PG polling ~500ms, no connection held during waits; closes normally after 25s. Reconnect with last delivered ID; retention/gap/backlog emits resync.required and closes: fetch consistent snapshot, paginate all items until hasMore=false up to lastItemSequence, then reconnect at snapshot eventCursor. Max 500 durable events/~1MB per connection; slow/aborted readers cannot cancel Turns.",
        "x-access": "public"
      }
    },
