name: musecanvas

# Image-based deployment stack.
# This file intentionally does NOT start MinIO or Mailpit and does NOT seed
# any SMTP/S3 defaults (no BUNDLED_SERVICES): SMTP, object storage, public
# origin, OAuth, limits, and prompt templates are database settings managed
# via the onboarding wizard at /setup. Only bootstrap secrets, default-deny
# policy flags, and optional one-release legacy crypto keys are passed via env.

services:
  postgres:
    restart: unless-stopped
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: musecanvas
      POSTGRES_USER: musecanvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_socket:/var/run/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U musecanvas -d musecanvas"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    restart: unless-stopped
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    restart: unless-stopped
    image: ghcr.io/nextroad-dev/musecanvas-api:${MUSECANVAS_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/data/media
    environment: &backend-env
      NODE_ENV: production
      SETUP_CLAIM_DELIVERY: ${SETUP_CLAIM_DELIVERY:-}
      SETUP_CLAIM_REQUIRED: ${SETUP_CLAIM_REQUIRED:-}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-12}
      DATABASE_CONNECTION_TIMEOUT_MS: ${DATABASE_CONNECTION_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TIMEOUT_MS: ${DATABASE_IDLE_TIMEOUT_MS:-30000}
      DATABASE_STATEMENT_TIMEOUT_MS: ${DATABASE_STATEMENT_TIMEOUT_MS:-30000}
      DATABASE_LOCK_TIMEOUT_MS: ${DATABASE_LOCK_TIMEOUT_MS:-5000}
      DATABASE_IDLE_TRANSACTION_TIMEOUT_MS: ${DATABASE_IDLE_TRANSACTION_TIMEOUT_MS:-30000}
      REDIS_CONNECT_TIMEOUT_MS: ${REDIS_CONNECT_TIMEOUT_MS:-1000}
      REDIS_COMMAND_TIMEOUT_MS: ${REDIS_COMMAND_TIMEOUT_MS:-1000}
      WORKER_REDIS_COMMAND_TIMEOUT_MS: ${WORKER_REDIS_COMMAND_TIMEOUT_MS:-5000}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-2}
      WORKER_STORAGE_TIMEOUT_MS: ${WORKER_STORAGE_TIMEOUT_MS:-60000}
      STREAM_RETENTION_SECONDS: ${STREAM_RETENTION_SECONDS:-604800}
      STREAM_TRIM_BATCH_SIZE: ${STREAM_TRIM_BATCH_SIZE:-1000}
      DATABASE_URL: postgresql://musecanvas:${POSTGRES_PASSWORD}@postgres:5432/musecanvas
      REDIS_URL: redis://redis:6379
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY is required}
      ALLOW_INSECURE_SMTP: ${ALLOW_INSECURE_SMTP:-false}
      ALLOW_INSECURE_PROVIDER_BASE_URL: ${ALLOW_INSECURE_PROVIDER_BASE_URL:-false}
      ALLOW_PRIVATE_PROVIDER_BASE_URL: ${ALLOW_PRIVATE_PROVIDER_BASE_URL:-false}
      # Admin plugin code-package upload is default-deny; flip per deployment.
      ALLOW_PLUGIN_UPLOAD: ${ALLOW_PLUGIN_UPLOAD:-false}
      # Where the worker caches downloaded plugin artifacts. Never under /app:
      # that is an ephemeral image layer shared by neither api nor worker.
      PLUGIN_CACHE_DIR: ${PLUGIN_CACHE_DIR:-/tmp/musecanvas-plugin-cache}
      # TLS is expected; set false only for an intentional direct-HTTP deployment.
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # One-release upgrade-only read fallback for pre-master-key rows (optional, fresh installs leave unset).
      SESSION_SECRET: ${SESSION_SECRET:-}
      OAUTH_CREDENTIALS_ENCRYPTION_KEY: ${OAUTH_CREDENTIALS_ENCRYPTION_KEY:-}
      PROVIDER_CREDENTIALS_ENCRYPTION_KEY: ${PROVIDER_CREDENTIALS_ENCRYPTION_KEY:-}
      # Object storage (S3-compatible) and SMTP fall back to these env values when
      # no database row exists yet (see apps/api/src/modules/settings/runtime.ts).
      # Fresh image-based installs set them in .env; the /setup wizard can later
      # override per deployment (DB rows take precedence).
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_PUBLIC_ENDPOINT: ${S3_PUBLIC_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_SIGNED_URL_TTL: ${S3_SIGNED_URL_TTL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_TLS_MODE: ${SMTP_TLS_MODE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-}

    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:3001/api/health/ready]
      interval: 5s
      timeout: 3s
      retries: 30
  db-password-sync:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        printf '%s\n%s\n' "$$POSTGRES_PASSWORD" "$$POSTGRES_PASSWORD" |
          psql --no-psqlrc --no-password --host=/var/run/postgresql --username=musecanvas --dbname=musecanvas --set=ON_ERROR_STOP=1 --command='\password musecanvas'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_socket:/var/run/postgresql

  db-migrate:
    image: ghcr.io/nextroad-dev/musecanvas-api:${MUSECANVAS_IMAGE_TAG:-latest}
    depends_on:
      postgres:
        condition: service_healthy
      db-password-sync:
        condition: service_completed_successfully
    command: ["sh", "-c", "pnpm --filter @musecanvas/database exec tsx src/migrate.ts && pnpm --filter @musecanvas/database exec tsx src/seed.ts && pnpm --filter @musecanvas/database exec tsx ../../scripts/seed-bundled-services.ts"]
    environment:
      DATABASE_URL: postgresql://musecanvas:${POSTGRES_PASSWORD}@postgres:5432/musecanvas
      APP_MASTER_KEY: ${APP_MASTER_KEY:?APP_MASTER_KEY is required}

  worker:
    restart: unless-stopped
    image: ghcr.io/nextroad-dev/musecanvas-worker:${MUSECANVAS_IMAGE_TAG:-latest}
    depends_on:
      api:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    volumes:
      - media_data:/data/media
    environment: *backend-env
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3010/health', {signal: AbortSignal.timeout(2000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 120s
    stop_grace_period: 30s

  web:
    restart: unless-stopped
    image: ghcr.io/nextroad-dev/musecanvas-web:${MUSECANVAS_IMAGE_TAG:-latest}
    environment:
      INTERNAL_API_BASE_URL: http://api:3001
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/]
      interval: 10s
      timeout: 3s
      retries: 30
      start_period: 20s

  nginx:
    restart: unless-stopped
    image: ghcr.io/nextroad-dev/musecanvas-nginx:${MUSECANVAS_IMAGE_TAG:-latest}
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    ports:
      - "${MUSECANVAS_HTTP_PORT:-18080}:80"

volumes:
  postgres_data: {}
  postgres_socket: {}
  redis_data: {}
  media_data: {}
