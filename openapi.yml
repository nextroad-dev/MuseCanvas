      "AgentCoreMessageAttachmentRef": {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "kind",
          "id",
          "role",
          "checksum",
          "width",
          "height",
          "mimeType"
        ],
        "description": "A managed input a turn may name. Ownership, checksum, dimensions and liveness are verified server-side at admission; a mask additionally requires a live 0045 preparation identity bound to the paired reference_image checksum. The client proves shape only.",
        "properties": {
          "kind": {
            "type": "string",
            "enum": [
              "upload",
              "asset"
            ]
          },
          "id": {
            "$ref": "#/components/schemas/AgentCoreUuid"
