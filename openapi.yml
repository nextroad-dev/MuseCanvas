          "checksum": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$"
          },
          "width": {
            "type": "integer",
            "minimum": 1,
            "maximum": 32768
          },
          "height": {
            "type": "integer",
            "minimum": 1,
            "maximum": 32768
          },
          "mimeType": {
            "type": "string",
            "enum": [
              "image/png",
              "image/jpeg"
            ]
          },
          "preparationVersion": {
            "type": "integer",
            "enum": [
              1
            ]
          },
          "sourceChecksum": {
            "type": "string",
            "pattern": "^[0-9a-f]{64}$",
            "description": "Required with preparationVersion for a mask; must equal the paired reference_image checksum."
          }
        }
      },
