                    "value": "event: text_delta\ndata: {\"type\":\"text_delta\",\"turnId\":\"123e4567-e89b-12d3-a456-000000000031\",\"eventId\":\"123e4567-e89b-12d3-a456-000000000040\",\"delta\":\"Example response\"}\n\n"
                  },
                  "tool_call": {
