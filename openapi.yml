              "kind"
            ],
            "properties": {
              "kind": {
                "const": "whole"
              }
            }
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "kind",
              "start",
              "end",
              "quote"
            ],
            "properties": {
              "kind": {
                "const": "text"
              },
              "start": {
                "type": "integer",
                "minimum": 0,
                "maximum": 9007199254740991
              },
              "end": {
                "type": "integer",
                "minimum": 1,
                "maximum": 9007199254740991
              },
              "quote": {
                "type": "string",
                "minLength": 1,
                "maxLength": 32000,
                "x-maxUtf8Bytes": 32000,
                "pattern": "^[^\u0000]+$",
                "description": "Exact selected text, at most 32000 UTF-8 bytes; whitespace is allowed."
              }
            },
            "description": "Text artifacts only. UTF-16 offsets: start inclusive, end exclusive, start < end <= content.length. quote must equal content.slice(start, end); neither offset may split a surrogate pair."
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "kind",
              "x",
              "y"
            ],
            "properties": {
              "kind": {
                "const": "image_point"
              },
              "x": {
                "type": "number",
                "minimum": 0,
                "maximum": 1
              },
              "y": {
                "type": "number",
                "minimum": 0,
                "maximum": 1
              }
            },
            "description": "Image artifacts only; coordinates are normalized to [0, 1]."
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "kind",
              "x",
              "y",
              "width",
              "height"
            ],
            "properties": {
              "kind": {
                "const": "image_rect"
              },
              "x": {
                "type": "number",
                "minimum": 0,
                "maximum": 1
              },
              "y": {
                "type": "number",
                "minimum": 0,
                "maximum": 1
              },
              "width": {
                "type": "number",
                "exclusiveMinimum": 0,
                "maximum": 1
              },
              "height": {
                "type": "number",
                "exclusiveMinimum": 0,
                "maximum": 1
              }
            },
            "description": "Image artifacts only; coordinates and dimensions are normalized. width and height must be positive, x + width <= 1 and y + height <= 1."
          },
          {
            "type": "object",
            "additionalProperties": false,
            "required": [
              "kind",
              "timeMs"
            ],
            "properties": {
              "kind": {
                "const": "video"
              },
              "timeMs": {
                "type": "integer",
                "minimum": 0,
                "maximum": 9007199254740991
              }
            },
            "description": "Video artifacts only; durationMs must be non-null and timeMs <= durationMs."
          }
        ],
        "description": "Strict anchor union checked against the immutable artifact. whole is valid for every kind; text, image and video anchors must match the artifact kind."
      },
