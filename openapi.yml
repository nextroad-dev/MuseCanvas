                  },
                  "tool_result": {
                    "value": "event: tool_result\ndata: {\"type\":\"tool_result\",\"turnId\":\"123e4567-e89b-12d3-a456-000000000031\",\"eventId\":\"123e4567-e89b-12d3-a456-000000000042\",\"toolCallId\":\"call_example\",\"result\":{\"ok\":true},\"success\":true}\n\n"
                  },
                  "canvas_ops": {
                    "value": "event: canvas_ops\ndata: {\"type\":\"canvas_ops\",\"turnId\":\"123e4567-e89b-12d3-a456-000000000031\",\"eventId\":\"123e4567-e89b-12d3-a456-000000000043\",\"ops\":[{\"type\":\"arrange\",\"positions\":[{\"nodeId\":\"123e4567-e89b-12d3-a456-000000000001\",\"position\":{\"x\":10,\"y\":20}}]}],\"baseRevision\":2}\n\n"
                  },
                  "pending_jobs": {
                    "value": "event: pending_jobs\ndata: {\"type\":\"pending_jobs\",\"turnId\":\"123e4567-e89b-12d3-a456-000000000031\",\"eventId\":\"123e4567-e89b-12d3-a456-000000000044\",\"pendingJobs\":[{\"id\":\"123e4567-e89b-12d3-a456-000000000023\",\"toolCallId\":\"call_example\",\"kind\":\"image\",\"prompt\":\"Synthetic example\",\"modelId\":\"123e4567-e89b-12d3-a456-000000000011\",\"parameters\":{},\"sourceNodeId\":null,\"sourceAssetId\":null,\"createdAt\":\"2026-10-05T12:00:00.000Z\",\"expiresAt\":\"2026-10-05T12:15:00.000Z\",\"status\":\"pending\",\"jobId\":null}]}\n\n"
                  },
                  "confirm_required": {
                    "value": "event: confirm_required\ndata: {\"type\":\"confirm_required\",\"turnId\":\"123e4567-e89b-12d3-a456-000000000031\",\"eventId\":\"123e4567-e89b-12d3-a456-000000000045\",\"pending\":{\"id\":\"123e4567-e89b-12d3-a456-000000000023\",\"toolCallId\":\"call_example\",\"kind\":\"image\",\"prompt\":\"Synthetic example\",\"modelId\":\"123e4567-e89b-12d3-a456-000000000011\",\"parameters\":{},\"sourceNodeId\":null,\"sourceAssetId\":null,\"createdAt\":\"2026-10-05T12:00:00.000Z\",\"expiresAt\":\"2026-10-05T12:15:00.000Z\",\"status\":\"pending\",\"jobId\":null}}\n\n"
                  },
                  "done": {
                    "value": "event: done\ndata: {\"type\":\"done\",\"turnId\":\"123e4567-e89b-12d3-a456-000000000031\",\"eventId\":\"123e4567-e89b-12d3-a456-000000000046\",\"message\":{\"id\":\"123e4567-e89b-12d3-a456-000000000024\",\"seq\":2,\"role\":\"assistant\",\"content\":\"Example response\",\"createdAt\":\"2026-10-05T12:00:00.000Z\"},\"usage\":{\"inputTokens\":10,\"outputTokens\":5},\"requireConfirmation\":true,\"autoContinuationCount\":0}\n\n"
