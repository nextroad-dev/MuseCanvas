name: musecanvas

# Bundled local stack: Postgres, Redis, MinIO, and Mailpit are started here.
# Application SMTP/S3 settings are NOT passed via env — db-migrate seeds the
# dev Mailpit/bundled-MinIO values into the database (BUNDLED_SERVICES=true)
# so the onboarding wizard opens with them prefilled (configured, unverified).
# Long-lived api/worker processes receive only bootstrap secrets, default-deny
# policy flags, and optional one-release legacy crypto keys.

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: musecanvas
      POSTGRES_USER: musecanvas
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - postgres_socket:/var/run/postgresql
    healthcheck:
      test: [CMD-SHELL, "pg_isready -h 127.0.0.1 -U musecanvas -d musecanvas"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-musecanvas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_API_CORS_ALLOW_ORIGIN: ${MINIO_API_CORS_ALLOW_ORIGIN:-http://localhost:8080,http://127.0.0.1:8080,http://localhost:5173,http://127.0.0.1:5173}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - sh
      - -c
      - |
        until mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD; do sleep 2; done
        mc mb --ignore-existing local/musecanvas
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-musecanvas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "8025:8025"

  api:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      db-migrate:
        condition: service_completed_successfully
    environment: &backend-env
      NODE_ENV: production
      DATABASE_URL: postgresql://musecanvas:${POSTGRES_PASSWORD}@postgres:5432/musecanvas
      REDIS_URL: redis://redis:6379
      APP_MASTER_KEY: ${APP_MASTER_KEY}
      # Bundled Mailpit speaks plaintext SMTP; every other deployment denies it.
      ALLOW_INSECURE_SMTP: "true"
      ALLOW_INSECURE_PROVIDER_BASE_URL: "false"
      ALLOW_PRIVATE_PROVIDER_BASE_URL: "false"
      # This bundled stack is served directly over HTTP by default.
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # One-release upgrade-only read fallback for pre-master-key rows (optional, fresh installs leave unset).
      SESSION_SECRET: ${SESSION_SECRET:-}
      OAUTH_CREDENTIALS_ENCRYPTION_KEY: ${OAUTH_CREDENTIALS_ENCRYPTION_KEY:-}
      PROVIDER_CREDENTIALS_ENCRYPTION_KEY: ${PROVIDER_CREDENTIALS_ENCRYPTION_KEY:-}
    healthcheck:
      test: [CMD, wget, -qO-, http://localhost:3001/api/health/ready]
      interval: 5s
      timeout: 3s
      retries: 30
  db-password-sync:
    image: postgres:17-alpine
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        printf '%s\n%s\n' "$$POSTGRES_PASSWORD" "$$POSTGRES_PASSWORD" |
          psql --no-psqlrc --no-password --host=/var/run/postgresql --username=musecanvas --dbname=musecanvas --set=ON_ERROR_STOP=1 --command='\password musecanvas'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_socket:/var/run/postgresql

  db-migrate:
    build:
      context: .
      dockerfile: deploy/docker/api.Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      db-password-sync:
        condition: service_completed_successfully
    command: ["sh", "-c", "pnpm --filter @musecanvas/database exec tsx src/migrate.ts && pnpm --filter @musecanvas/database exec tsx src/seed.ts && pnpm --filter @musecanvas/database exec tsx ../../scripts/seed-bundled-services.ts"]
    environment:
      DATABASE_URL: postgresql://musecanvas:${POSTGRES_PASSWORD}@postgres:5432/musecanvas
      APP_MASTER_KEY: ${APP_MASTER_KEY}
      BUNDLED_SERVICES: "true"
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-musecanvas}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

  worker:
    build:
      context: .
      dockerfile: deploy/docker/worker.Dockerfile
    depends_on:
      api:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    environment: *backend-env

  web:
    build:
      context: .
      dockerfile: deploy/docker/web.Dockerfile
      args:
        VITE_API_BASE_URL: ""

  nginx:
    build:
      context: .
      dockerfile: deploy/docker/nginx.Dockerfile
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  postgres_data: {}
  postgres_socket: {}
  redis_data: {}
  minio_data: {}
