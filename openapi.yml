      "post": {
        "operationId": "postCanvasAgentMessages",
        "summary": "Start or recover bounded agent turn",
        "description": "Pre-stream claim/validation errors are JSON with error HTTP status. After 200 SSE begins, expected failures emit error and terminate without new HTTP status. Upstream nonstreaming; text_delta is full segment, not token realtime. Ops are proposals only: apply locally then PATCH current revision. Stable message identity supports persisted-turn recovery, NOT Last-Event-ID replay. Recover via history snapshot and GET canvas. Default confirmation true; job_event inherits and server verifies terminal state. Shared actor agent limit 30/min includes history/confirm. Disconnect aborts remaining work but does not cancel already committed generations.",
        "tags": [
          "Canvas"
        ],
        "x-access": "actor",
        "security": [
          {
            "museSession": []
          }
        ],
        "responses": {
          "200": {
            "description": "SSE: connected and 15000 ms heartbeat comments have no data. event name equals data.type. No guaranteed resumable event log.",
            "content": {
              "text/event-stream": {
                "schema": {
                  "type": "string"
                },
                "x-event-schema": {
                  "$ref": "#/components/schemas/AgentStreamEvent"
                },
